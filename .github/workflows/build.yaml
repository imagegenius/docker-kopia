---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        description: Release
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    uses: $/.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      release: ${{ inputs.release }}

  merge:
    if: ${{ inputs.release }}
    name: Merge
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    needs:
      - build
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Download Bake Metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bake-metadata
          path: ${{ runner.temp }}

      - name: Download Digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Manifest List and Push
        working-directory: ${{ runner.temp }}/digests
        env:
          APP: ${{ needs.build.outputs.app }}
          OWNER: ${{ github.repository_owner }}
          META: ${{ runner.temp }}/docker-metadata-action-bake.json
        run: |-
          # shellcheck disable=SC2046
          docker buildx imagetools create \
              $(jq --raw-output --compact-output ".target.\"docker-metadata-action\".tags | map(select(startswith(\"ghcr.io/$OWNER/$APP\")) | \"-t \" + .) | join(\" \")" "$META") \
              $(printf "ghcr.io/$OWNER/$APP@sha256:%s " *)

      - name: Inspect Image
        env:
          APP: ${{ needs.build.outputs.app }}
          OWNER: ${{ github.repository_owner }}
          META: ${{ runner.temp }}/docker-metadata-action-bake.json
        run: |-
          TAG=$(jq --raw-output '.target."docker-metadata-action".args.DOCKER_META_VERSION' "$META")
          docker buildx imagetools inspect "ghcr.io/$OWNER/$APP:$TAG"

      - name: Export Digest
        id: digest
        env:
          APP: ${{ needs.build.outputs.app }}
          OWNER: ${{ github.repository_owner }}
          META: ${{ runner.temp }}/docker-metadata-action-bake.json
        run: |-
          TAG=$(jq --raw-output '.target."docker-metadata-action".args.DOCKER_META_VERSION' "$META")
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/$OWNER/$APP:$TAG" --format '{{ json . }}' | jq --raw-output '.manifest.digest')
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"

  attest:
    if: ${{ inputs.release }}
    name: Attest
    needs:
      - build
      - merge
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Upload Dependency Snapshot
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          dependency-snapshot: true
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          image: ghcr.io/${{ github.repository_owner }}/${{ needs.build.outputs.app }}@${{ needs.merge.outputs.digest }}

      - name: Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ needs.build.outputs.app }}
          subject-digest: ${{ needs.merge.outputs.digest }}

      - name: Verify Attestation
        env:
          APP: ${{ needs.build.outputs.app }}
          DIGEST: ${{ needs.merge.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |-
          gh attestation verify --repo "$REPO" "oci://ghcr.io/${{ github.repository_owner }}/${APP}@${DIGEST}"
